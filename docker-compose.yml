services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-MatKhauManh@123!}
      MYSQL_DATABASE: forum_db
    networks:
      - internal_network

  phpmyadmin_tool:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_tool
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
    networks:
      - internal_network

  forum_app:
    build: ./app
    container_name: forum_app
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-MatKhauManh@123!}
    networks:
      - internal_network

  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - internal_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_mon
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - internal_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ui
    ports:
      - "3000:3000"
    networks:
      - internal_network

  loki:
    image: grafana/loki:2.9.2
    container_name: loki_log
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - internal_network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail_agent
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge