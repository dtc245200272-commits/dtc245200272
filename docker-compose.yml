version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: forum_db
    networks:
      - internal_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_tool
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    networks:
      - internal_network
      - web_network

  webapp:
    build: ./app
    container_name: forum_app
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal_network
      - web_network
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - web_network
    depends_on:
      - webapp

networks:
  internal_network:
    internal: true
  web_network: